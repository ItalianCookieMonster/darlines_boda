# Netlify configuration
# This site is a static site with no build step.
# Deploy by dragging the project folder into Netlify,
# or by connecting a GitHub repository.

[build]
  publish = "."   # The root of the project is the publish directory
  # No build command needed — pure HTML/CSS/JS

# ── Headers ──────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"

# Cache static assets aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache fonts
[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# ── Redirects ────────────────────────────────────────────────────
# Redirect www to non-www (adjust if your domain uses www)
# [[redirects]]
#   from   = "https://www.example.com/*"
#   to     = "https://example.com/:splat"
#   status = 301
#   force  = true
